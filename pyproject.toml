[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tealca"
version = "0.1.0"
description = "Technoeconomic analysis and life cycle assessment toolkit"
authors = [
  { name = "Open Source Contributor" }
]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["technoeconomic", "life cycle assessment", "sustainability", "analysis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.0",
    "pyyaml>=6.0",
    "typer>=0.9",
]

[project.optional-dependencies]
lca = [
    "brightway2>=2.4",
    "bw2calc>=1.8.2,<2.0",
    "bw2data>=3.5",
]

[project.urls]
Homepage = "https://github.com/example/tealca"
Documentation = "https://github.com/example/tealca"

[project.scripts]
tealca = "tealca.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
